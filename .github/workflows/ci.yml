name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Authenticated downloads from GitHub have a higher rate limit
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    lint:
        name: Pint and Larastan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-lint-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-lint-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Check code style
              run: vendor/bin/pint --test

            - name: Run static analysis
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    tests:
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.laravel }}-

            - name: Install dependencies
              run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Show installed versions
              run: |
                  for package in laravel/framework orchestra/testbench phpunit/phpunit; do
                      composer show "$package" | grep -E '^(name|versions)'
                  done

            - name: Run tests
              run: vendor/bin/phpunit

    e2e:
        name: End to end
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Cache Composer downloads
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-e2e-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ runner.os }}-e2e-

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            # Redis and ghcr.io/urbania-media/eclair:main with SQLite, a project, its key and the
            # app storage. The variables of the tests go to the next steps.
            - name: Start Eclair
              run: tests/EndToEnd/eclair.sh up >> "$GITHUB_ENV"

            - name: Run the end-to-end tests
              run: vendor/bin/phpunit --testsuite EndToEnd --fail-on-skipped

            - name: Show Eclair's logs
              if: failure()
              run: tests/EndToEnd/eclair.sh logs
